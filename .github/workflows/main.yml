name: Glacier.ML CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libeigen3-dev \
            libboost-all-dev \
            libopenblas-dev \
            libomp-dev

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build Targets
        run: cmake --build build --target test_logr

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure